# Utenti di prova del profilo "mocked" (come identity.yaml di ScoutShopper-be).
# All'avvio il backend crea o aggiorna ogni utente su MongoDB (chiave agesciUUID) e genera per
# ciascuno un token firmato, tenuto solo in memoria: lo restituisce GET /api/v1/mock/auth/findAll.
# I token NON vanno scritti qui e cambiano a ogni riavvio.
#
# Campi di ogni voce:
#   agesciUUID        obbligatorio, unico nel file
#   buonaCacciaUUID   facoltativo: se c'è diventa l'id dell'utente (utile nei test)
#   label             etichetta per il frontend
#   username, firstName, lastName, email
#   authentication    claim del token: isMemberOf, role (lista), entitlement (lista)
#   birthDate         facoltativa: serve per l'età alla partenza (requisiti degli eventi)
#   census            facoltativo: dati di censimento; assente = persona non socia AGESCI.
#                     year assente = anno corrente; groupLeader true = capo gruppo del groupId
mocked-identity:
  users:
    - agesciUUID: 7c1e2a2e-0001-4a6b-9a01-000000000001
      buonaCacciaUUID: user-001
      label: "Amministrazione"
      username: amministratore
      firstName: "Anna"
      lastName: "Amministratrice"
      email: amministratore@buonacaccia.local
      authentication:
        isMemberOf: agesci:socio:false
        role:
          - agesci:sistema:amministratore
        entitlement:
          - agesci:entitlement:tipoevento:gestione
          - agesci:entitlement:evento:gestione
          - agesci:entitlement:iscrizione:gestione
          - agesci:entitlement:pagamento:registrazione
