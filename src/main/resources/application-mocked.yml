# Profilo mocked: utenti di prova da mocked-identity.yml e token firmati dal backend.
# L'import non è opzionale: se il file manca l'applicazione non parte.
spring:
  config:
    import: classpath:mocked-identity.yml

buonacaccia:
  mock-auth:
    # Durata dei token mock (ISO 8601). Per default coprono tutta la vita del processo.
    token-validity: P365D
