spring:
  application:
    name: buonacaccia-be
  # Utenti di prova del mock: usati solo con il profilo mocked (MockAuthConfig).
  config:
    import: optional:classpath:mocked-identity.yml
  data:
    mongodb:
      auto-index-creation: true
  # Collegamento a MongoDB (container di compose.yaml): SPRING_MONGODB_URI in test-src/env/test.env.
  security:
    oauth2:
      resourceserver:
        jwt:
          # Fuori dal profilo mocked i token arrivano da Keycloak (fase 6): realm buonacaccia.
          # Nel profilo mocked il decoder usa la chiave in memoria (MockAuthConfig).
          jwk-set-uri: ${BUONACACCIA_JWK_SET_URI:http://localhost:8180/realms/buonacaccia/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# Circuit breaker sulle chiamate a MongoDB (Resilience4j, istanza "mongodb").
# Su 10 chiamate, se almeno 5 sono state fatte e la metà fallisce, il circuito si apre per 5 s:
# le richieste rispondono subito 503 invece di aspettare il database.
resilience4j:
  circuitbreaker:
    instances:
      mongodb:
        register-health-indicator: true
        allow-health-indicator-to-fail: false
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
        ignore-exceptions:
          - org.springframework.dao.DuplicateKeyException

# Log: console (terminale di IntelliJ) e file logs/buonacaccia.log (ignorato da git).
# I log di @Slf4j (log.info, log.debug...) nel package it.buonacaccia escono dal livello DEBUG in su;
# per vederne meno basta mettere INFO. Le librerie (Spring, Mongo) restano a INFO.
logging:
  level:
    root: ${LOGGING_LEVEL:info}
    it.buonacaccia: ${LOGGING_LEVEL:debug}
  file:
    name: logs/buonacaccia.log
  pattern:
    console: "%d{HH:mm:ss.SSS} %highlight(%-5level) %cyan(%logger{36}) - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Documentazione OpenAPI generata (springdoc) e Swagger UI.
# JSON: http://localhost:8080/api-docs   Interfaccia: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true
  default-produces-media-type: application/json
