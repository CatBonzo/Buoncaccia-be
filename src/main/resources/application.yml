spring:
  application:
    name: buonacaccia-be
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/buonacaccia?directConnection=true}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Fuori dal profilo mocked i token arrivano da Keycloak (fase 6): realm buonacaccia.
          # Nel profilo mocked il decoder usa la chiave in memoria (MockAuthConfig).
          jwk-set-uri: ${BUONACACCIA_JWK_SET_URI:http://localhost:8180/realms/buonacaccia/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Documentazione OpenAPI generata (springdoc) e Swagger UI.
# JSON: http://localhost:8080/v3/api-docs   Interfaccia: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true
  default-produces-media-type: application/json
