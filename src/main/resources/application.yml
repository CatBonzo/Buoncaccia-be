spring:
  application:
    name: buonacaccia-be
  # Utenti di prova del mock: usati solo con il profilo mocked (MockAuthConfig).
  config:
    import: optional:classpath:mocked-identity.yml
  data:
    mongodb:
      auto-index-creation: true
  # Collegamento a MongoDB (container di docker-compose.yaml): SPRING_MONGODB_URI in test-src/env/test.env.
  # Kafka (ADR-003, fase 4): indirizzo in SPRING_KAFKA_BOOTSTRAP_SERVERS (test-src/env/).
  # Chiave e valore sono stringhe: il JSON del DomainEvent lo scrive e lo legge l'applicazione.
  kafka:
    producer:
      acks: all
      # Con Kafka fermo il relay deve arrendersi presto e riprovare al giro dopo (research R1),
      # non restare bloccato i 60 s predefiniti.
      properties:
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      group-id: buonacaccia-notifications
      auto-offset-reset: earliest
  # Posta in uscita: in locale Mailpit (SPRING_MAIL_HOST/PORT in test-src/env/), interfaccia su http://localhost:8025.
  mail:
    default-encoding: UTF-8
  servlet:
    multipart:
      # Limite del server per i documenti (feature 006, research R3): il controllo per adempimento lo fa il servizio.
      max-file-size: 10MB
      max-request-size: 11MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # Fuori dal profilo mocked i token arrivano da Keycloak (fase 6): realm buonacaccia.
          # Nel profilo mocked il decoder usa la chiave in memoria (MockAuthConfig).
          jwk-set-uri: ${BUONACACCIA_JWK_SET_URI:http://localhost:8180/realms/buonacaccia/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Un caricamento oltre i 10 MB va letto fino in fondo, altrimenti il client non riceve il 422 (feature 006).
    max-swallow-size: 16MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# Circuit breaker sulle chiamate a MongoDB (Resilience4j, istanza "mongodb").
# Su 10 chiamate, se almeno 5 sono state fatte e la metà fallisce, il circuito si apre per 5 s:
# le richieste rispondono subito 503 invece di aspettare il database.
resilience4j:
  circuitbreaker:
    instances:
      mongodb:
        register-health-indicator: true
        allow-health-indicator-to-fail: false
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
        ignore-exceptions:
          - org.springframework.dao.DuplicateKeyException
          - org.springframework.dao.OptimisticLockingFailureException

# Log: console (formato standard di Spring Boot) e file logs/buonacaccia.log (ignorato da git).
# Le librerie (Spring, Mongo, Kafka) restano sempre a INFO; solo i log di @Slf4j del package
# it.buonacaccia seguono LOGGING_LEVEL (negli env è debug; senza variabile, info).
logging:
  level:
    root: info
    it.buonacaccia: ${LOGGING_LEVEL:info}
  file:
    name: logs/buonacaccia.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Documentazione OpenAPI generata (springdoc) e Swagger UI.
# JSON: http://localhost:8080/api-docs   Interfaccia: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true
  default-produces-media-type: application/json

# Notifiche e-mail (feature 004): mittente, indirizzo del frontend per il link di autorizzazione,
# giro del relay outbox → Kafka e ritentativi dell'invio prima del dead letter (research R1, R5, R8).
buonacaccia:
  notifications:
    from: noreply@buonacaccia.local
    link-base-url: ${BUONACACCIA_LINK_BASE_URL:http://localhost:4200/autorizza}
    relay-delay: PT1S
    retry:
      initial-interval: 1s
      multiplier: 2
      max-attempts: 4
