name: build

on:
  push:
    branches: [feature, main]
  pull_request:
    branches: [feature, main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build e test
        run: ./gradlew build
